###############################################################
# +---------------------------------------------------------+ #
# |                    Images Configuration                 | #
# +---------------------------------------------------------+ #
###############################################################

# Version of this configuration file. When the plugin is updated
# and this number is lower than the one bundled with the new version,
# the config is automatically migrated to the latest version while
# keeping any values that you have modified. A backup of the old file
# is created at 'config.yml.bak' just in case.
config-version: 2

# Item frames and maps will appear invisible behind
# the image giving the effect that the pixels are
# floating without anything behind them while also
# not rendering blank space on an image.
# NOTE: only supported in 1.16+
invisible-frames: true

# Image sections within this range will be visible to players
show-distance: 64

# Image sections beyond this range will be hidden from players
hide-distance: 128

database:
  # The type of database that can be used
  # Options: MYSQL, SQLITE, FILE - Default: SQLITE
  type: SQLITE
  # If using MYSQL above, below is the applicable login information
  # The IP or hostname of the database
  host: localhost
  # The port to connect on
  port: 3306
  # The database or catalog to initially connect to
  schema: test
  # The username and password to login with
  user: username
  password: password
  # If the database needs to be initialized (e.g. the tables created etc.)
  # Unless you manually manage your database you probably won't need to touch this
  initialize: true

permissions:

  # Note that, if moving to a legacy version (1.0.x-SNAPSHOT), then
  # images should be re-created before enabling this feature

  # If images, once created, should only be able to be modified
  # by the original image creator
  # This excludes players with the permission 'images.restricted.bypass'
  creator-restricted: false

# Check for a newer version on GitHub Releases and download it
# automatically. The new version is applied on the next restart.
update-check: true

# How often to check for updates, in minutes
update-interval-minutes: 360

# Formats that require a static ffmpeg binary to decode (JPEG XL,
# WebM) and fallback for any image that the Java ImageIO cannot
# read. The binary is downloaded automatically once per platform
# (BtbN FFmpeg-Builds, which include JPEG XL) and cached in the
# '.ffmpeg' folder under the plugin data directory.
ffmpeg:
  # If ffmpeg decoding and downloading is enabled at all
  enabled: true
  # The path to a custom ffmpeg binary. If empty, a static binary
  # is downloaded automatically on first use and cached.
  path: ""
  # The base URL to download the static ffmpeg binary from.
  # (the '{filename}' token is replaced with the archive name)
  download-url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/{filename}
  # Losslessly re-compress image sources (PNG/WebP/JPEG XL) when they
  # are read for image creation using the command for their format.
  # The optimized copy is cached in the '.imgcache' folder keyed by
  # content, so re-using the same source costs nothing. Hardware
  # acceleration is only attempted when the device is actually mounted.
  recompress: true
  # Preferred re-compression format: AUTO, PNG, WEBP or JXL.
  # AUTO picks the best lossless encoder available (JXL > WebP > PNG).
  recompress-format: AUTO

# Lossless zstd compression of stored images (database/file).
# This only affects newly saved data; existing data remains readable.
image-storage:
  compression: true
