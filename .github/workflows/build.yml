name: Build plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven 3.9.16
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build with Maven
        run: mvn -B -U clean install -DskipTests --no-transfer-progress

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release jar: Images-EscoriasSMP-$VERSION.jar"

      - name: Stage plugin jar
        run: cp "Images-Core/target/images-${{ steps.version.outputs.version }}.jar" "Images-EscoriasSMP-${{ steps.version.outputs.version }}.jar"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Images-EscoriasSMP-${{ steps.version.outputs.version }}
          path: Images-EscoriasSMP-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 90

      - name: Attach jar to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Images-EscoriasSMP-${{ steps.version.outputs.version }}.jar