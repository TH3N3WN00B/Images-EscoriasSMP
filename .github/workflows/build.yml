name: Build plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven 3.9.16
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build with Maven
        run: mvn -B -U clean install -DskipTests --no-transfer-progress

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage versioned plugin jars
        run: |
          mkdir -p dist
          for pom in Images-v*/pom.xml; do
            MC=$(grep -A1 '<artifactId>spigot-api</artifactId>' "$pom" | grep -m1 '<version>' | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/; s/-R0\.1-SNAPSHOT$//')
            if [ -n "$MC" ]; then
              cp "Images-Core/target/images-${{ steps.version.outputs.version }}.jar" "dist/images-escoriassmp-$MC-${{ steps.version.outputs.version }}.jar"
            fi
          done
          ls -1 dist

      - name: Upload plugin jars
        uses: actions/upload-artifact@v6
        with:
          name: Images-EscoriasSMP-${{ steps.version.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar